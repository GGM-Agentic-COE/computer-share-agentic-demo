# L1-construction-api-code-generator · Phase 6
# MVP simplification vs. db-schema.sql: H2 in-memory + Hibernate auto-DDL stands in for the
# documented PostgreSQL/JSONB target schema so the demo runs with zero external services.
# See docs/sdlc/phase-6-construction/review-report.md for the reconciliation note.
spring:
  application:
    name: regfiling-api
  datasource:
    url: jdbc:h2:mem:regfiling;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  cors:
    allowed-origins: "http://localhost:5173"
